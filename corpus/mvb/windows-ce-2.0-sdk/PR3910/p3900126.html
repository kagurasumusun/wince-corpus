<P>
<B>Description :</B>  The contents of general register <I>rs </I>are combined with the contents of general register <I>rt</I> in a bit-wise logical NOR operation. The result is placed into general
register <I>rd</I>.
<P>
<B>Operation :
<P>
</B>  T:  GPR[rd]  GPR[rs] <I>nor</I> GPR[rt]
<P>
<B>Exceptions :</B>  None.
