<A NAME="off_328643"></A><A NAME="284bb6c8"></A><FONT FACE="Arial" SIZE="6"><B><H1>4.2.9 DEPC Register
<P>
</H1></B></FONT><FONT FACE="Arial" SIZE="3">The DEPC register holds the address where the processing is to resume after
debug exception has been taken care of. Refer to Debug Module for more
description. The DEPC register is accessed via the MTC0 and MFC0 instructions as
coprocessor zero register 17.
<P>
