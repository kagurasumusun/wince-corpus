<A NAME="off_1573773"></A><A NAME="45f93685"></A><FONT FACE="Arial" SIZE="3"><H1>SRA    Shift Right Arithmetic
<P>
 </H1></FONT><FONT FACE="Times New Roman" SIZE="6"><IMG SRC="P3900101.gif" ALT="P3900101.gif" BORDER=0 WIDTH=681 HEIGHT=92>
<P>
</FONT><FONT FACE="Arial" SIZE="3"><B>Format :</B>  SRA rd,rt,shamt
<P>
<B>Description :</B>  The contents of general register <I>rt</I> are shifted right by <I>shamt </I>bits, sign-extending the high order bits. The 32-bit result is placed in
register <I>rd</I>.
<P>
<B>Operation :
<P>
  </B>T:  GPR[rd]   (GPR[rt]31)shamt || GPR[rt]31..shamt
<P>
<B>Exceptions :</B>  None.
<P>
</FONT></BODY>
