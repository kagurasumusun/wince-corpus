<A NAME="off_1671855"></A><A NAME="233e6b39"></A><FONT FACE="Arial" SIZE="3"><H1>TLBR      Read Indexed TLB Entry
<P>
 </H1></FONT><FONT FACE="Times New Roman" SIZE="6"><IMG SRC="P3900114.gif" ALT="P3900114.gif" BORDER=0 WIDTH=672 HEIGHT=89>
<P>
</FONT><FONT FACE="Arial" SIZE="3"><B>Format :</B>  TLBR
<P>
<B>Description :</B>  This instruction is only valid for a processor with on chip TLB. The EntryHi
and EntryLo registers are loaded with the contents of the TLB entry pointed by
the TLB index register.
<P>
<B>Exceptions :</B>  Coprcessor unusable exception.
<P>
