<A NAME="off_2033311"></A><A NAME="cc7e64e0"></A><FONT FACE="Arial" SIZE="3"><H1>9.4.6 Debug exception handler execution
<P>
</H1>When a debug exception occurs, the user program should determine the nature of
the exception from the debug register bits (DSS, DBp) and invoke the
corresponding exception handler.
<P>
Exception priorities:
<P>
DSS has a higher priorities than DBp
<P>
