<P>
 </H1></FONT><FONT FACE="Times New Roman" SIZE="6"><IMG SRC="P3900116.gif" ALT="P3900116.gif" BORDER=0 WIDTH=678 HEIGHT=91>
<P>
</FONT><FONT FACE="Arial" SIZE="3"><B>Format :</B>  TLBWR
<P>
<B>Description :</B>  This instruction is only valid for a processor with on chip TLB. The TLB
pointed by the TLB Random register is loaded with the contents of EntryHi and
EntryLo registers.
<P>
<B>Exceptions :</B>  Coprcessor unusable exception
