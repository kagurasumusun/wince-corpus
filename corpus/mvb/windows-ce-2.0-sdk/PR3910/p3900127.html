 </H1></FONT><FONT FACE="Times New Roman" SIZE="6"><IMG SRC="P3900089.gif" ALT="P3900089.gif" BORDER=0 WIDTH=677 HEIGHT=99>

</FONT><FONT FACE="Arial" SIZE="3"><B>Format :</B>  OR rd,rs,rt
<P>
<B>Description :</B>  The contents of general register <I>rs</I> are combined with the contents of general register <I>rt</I> in a bit-wise logical OR operation. The result is placed into general
register <I>rd</I>.
<P>
<B>Operation :
<P>
  </B>T:  GPR[rd]  GPR[rs] <I>or</I> GPR[rt]
<P>
<B>Exceptions :</B>  None.
<P>
