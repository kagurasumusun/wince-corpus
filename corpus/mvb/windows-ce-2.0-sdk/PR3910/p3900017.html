<A NAME="off_131906"></A><A NAME="178d9f9e"></A><FONT FACE="Arial" SIZE="3"><H1>3.1.4 Nonblocking Load Function
<P>
</H1>The nonblocking load function prevents the pipeline from stalling when a cache
miss occurs and a refill cycle is required to refill the data cache for load
operation. Any Instructions after load instruction without data dependency will
continue to be executed.
<P>
