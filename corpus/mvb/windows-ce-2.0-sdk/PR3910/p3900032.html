<A NAME="off_327680"></A><A NAME="cc673b64"></A><FONT FACE="Arial" SIZE="3"><H1>4.2.7 BadVAddr Register
<P>
</H1>The Bad Virtual Address Register saves the entire bad virtual address for any
addressing exception: <I>AdEL</I> or <I>AdES</I>.
<P>
</FONT><FONT FACE="Times New Roman" SIZE="3"><B>Register 8</B>  BadVAddr - Bad Virtual Address Register  Read Only
<P>
</FONT><FONT FACE="Arial" SIZE="3">The BadVAddr register is accessed by the MFC0 instruction as coprocessor
register 8.
<P>
