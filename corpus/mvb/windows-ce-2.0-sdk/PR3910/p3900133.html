<A NAME="off_1540096"></A><A NAME="caca9f2c"></A><FONT FACE="Arial" SIZE="3"><H1>SLL    Shift Left Logical
<P>
 </H1></FONT><FONT FACE="Times New Roman" SIZE="6"><IMG SRC="P3900095.gif" ALT="P3900095.gif" BORDER=0 WIDTH=682 HEIGHT=89>
<P>
</FONT><FONT FACE="Arial" SIZE="3"><B>Format :</B>  SLL rd,rt,shamt
<P>
<B>Description :</B>  The contents of general register <I>rt</I> are shifted left by <I>shamt</I> bits, inserting zeroes into the low order bits. The 32-bit result is placed
in register <I>rd</I>.
<P>
<B>Operation :
<P>
  </B>T:  GPR[rd]  GPR[rt]31-shamt..0 || 0shamt
<P>
<B>Exceptions :</B>  None.
<P>
</FONT></BODY>
