<A NAME="off_393632"></A><A NAME="350f59ab"></A><FONT FACE="Arial" SIZE="3"><H1>5.2.2 On-Chip TLB Major Characteristics
<P>
</H1>The on-chip TLB major characteristics are:
<P>
32 x 64-bit wide entries
<P>
fully associative
<P>
2 entry micro TLB for instruction address translation
<P>
instruction address translation accesses full TLB after micro-TLB miss
<P>
data address translation accesses full TLB
<P>
