<A NAME="off_1574533"></A><A NAME="08d9ca19"></A><FONT FACE="Arial" SIZE="3"><H1>SRL    Shift Right Logical
<P>
 </H1></FONT><FONT FACE="Times New Roman" SIZE="6"><IMG SRC="P3900103.gif" ALT="P3900103.gif" BORDER=0 WIDTH=684 HEIGHT=90>
<P>
</FONT><FONT FACE="Arial" SIZE="3"><B>Format :</B>  SRL rd,rt,shamt
<P>
<B>Description :</B>  The contents of general register<I> rt</I> are shifted right by <I>shamt </I>bits, inserting zeroes into the high order bits. The 32-bit result is placed
in register<I> rd</I>.
<P>
<B>Operation :
<P>
  </B>T:  GPR[rd]   0 shamt || GPR[rt]31..shamt
<P>
<B>Exceptions :</B>  None
<P>
