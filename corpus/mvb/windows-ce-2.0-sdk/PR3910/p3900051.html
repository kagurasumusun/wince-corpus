<A NAME="off_591381"></A><A NAME="13d27266"></A><FONT FACE="Times New Roman" SIZE="3"><B><H1>6.6 Return from Exception Handler
<P>
</H1></B></FONT><FONT FACE="Arial" SIZE="3">An example to return from Exception handler:
<P>
MFC0   r27, EPC   (store return address in general register)
<P>
JR   r27   (jump to return address)
<P>
RFE  (execute RFE instruction in branch delay slot)
<P>
