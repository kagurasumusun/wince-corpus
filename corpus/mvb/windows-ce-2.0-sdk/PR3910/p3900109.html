<A NAME="off_1344346"></A><A NAME="53d8c9f4"></A><FONT FACE="Arial" SIZE="3"><H1>LUI    Load Upper Immediate
<P>
 </H1></FONT><FONT FACE="Times New Roman" SIZE="6"><IMG SRC="P3900071.gif" ALT="P3900071.gif" BORDER=0 WIDTH=680 HEIGHT=91>
<P>
</FONT><FONT FACE="Arial" SIZE="3"><B>Format :</B>  LUI rt,immediate
<P>
<B>Description :</B>  The 16-bit <I>immediate</I> is shifted left 16 bits and concatenated to 16 bits of zeroes. The result is
placed into general register<I> rt</I>.
<P>
<B>Operation :
<P>
  </B>T:   GPR[rt]  immediate || 016
<P>
<B>Exceptions :</B>  None.
<P>
