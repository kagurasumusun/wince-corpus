<A NAME="off_198606"></A><A NAME="706ddb8f"></A><FONT FACE="Arial" SIZE="5"><B>START_REGION / END_REGION
<P>
</B></FONT><FONT FACE="Arial" SIZE="3">START_REGION <I>NameBegin
<BR></I>END_REGION <I>NameEnd
<P>
</I>These two macros are used to mark the beginning and end of a contiguous range
of text or data. <I>NameBegin</I> labels the beginning of the range and <I>NameEnd</I> labels the end. Both of these names are in the global name space.
<P>
