<A NAME="off_229693"></A><A NAME="d2a209f4"></A><FONT FACE="Arial" SIZE="5"><B>LEAF_BIGENTRY  
<P>
</B></FONT><FONT FACE="Arial" SIZE="3">Name[,[Section=]SectionName]
<P>
The same as LEAF_ENTRY, except uses the .bigentry assembler directive instead
of the .entry assembler directive.  Use this for functions that are more than
16,777,214 bytes long.  (Such a function would be very unusual.)
