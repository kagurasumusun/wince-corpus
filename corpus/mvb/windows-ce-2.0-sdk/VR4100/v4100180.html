<A NAME="off_1967066"></A><A NAME="c5f78463"></A><FONT FACE="Arial" SIZE="3"><H1>CACHE Operations
<P>
</H1>The processor provides a variety of CACHE operations to maintain the state and
contents of the primary caches. The processor can issue write requests during
the execution of the CACHE operation instructions.
