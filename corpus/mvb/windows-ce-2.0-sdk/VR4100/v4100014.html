<A NAME="off_198128"></A><A NAME="4f157e52"></A><FONT FACE="Arial" SIZE="3"><H1>64-bit Operations 
<P>
</H1>When operating in 64-bit mode, 32-bit operands must be sign extended. The
result of operations that use incorrectly-sign-extended 32-bit values is
unpredictable. 
<P>
