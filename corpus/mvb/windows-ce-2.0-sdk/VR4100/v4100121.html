<A NAME="off_1475085"></A><A NAME="6b1a77c4"></A><FONT FACE="Arial" SIZE="3"><H1>MasterOut
<P>
</H1>The processor generates the clock output signal, <B>MasterOut</B>, at the same frequency as <B>MasterClock</B>. MasterOut clocks external logic, such as the reset and interrupt logic.
