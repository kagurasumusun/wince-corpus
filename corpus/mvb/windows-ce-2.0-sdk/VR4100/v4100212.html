<A NAME="off_2326934"></A><A NAME="162dd303"></A><FONT FACE="Arial" SIZE="3"><H1>12.3  Software Interrupt
<P>
</H1>Software interrupts use bits 1 and 0 of the interrupt pending, <I>IP</I>, field in the <I>Cause</I> register. These may be written by software, but there is no hardware
mechanism to set or clear these bits.
<P>
These interrupts are maskable.
<P>
