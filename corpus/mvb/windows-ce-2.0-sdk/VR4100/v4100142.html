<A NAME="off_1607882"></A><A NAME="bc279967"></A><FONT FACE="Arial,Helvetica"><H1>Cache Line Lengths
<P>
</H1></FONT><FONT FACE="Arial" SIZE="3">A <I>cache line</I> is the smallest unit of information that can be fetched from main memory for
the cache, and that is represented by a single tag. (Cache tags are described
in the following sections.)
<P>
The line size for the instruction/data cache is 4 words (16 bytes).
