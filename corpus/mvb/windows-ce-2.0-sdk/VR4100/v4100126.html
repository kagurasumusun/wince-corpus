<A NAME="off_1476657"></A><A NAME="7a7c385b"></A><FONT FACE="Arial" SIZE="3"><H1>Alignment to SClock
<P>
</H1>Processor data becomes stable a minimum of tDM ns and a maximum of tDO ns
after the rising edge of <B>SClock</B>. This drive-time is the sum of the maximum delay through the processor output
drivers together with the maximum clock-to-Q delay of the processor output
registers.
