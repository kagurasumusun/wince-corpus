<A NAME="off_1935532"></A><A NAME="192f28df"></A><FONT FACE="Arial" SIZE="3"><H1>Fetch Miss
<P>
</H1>When the processor misses in the instruction cache on a fetch, it issues a
read request for the cache line and waits for an external agent to provide this
data in a read response.
