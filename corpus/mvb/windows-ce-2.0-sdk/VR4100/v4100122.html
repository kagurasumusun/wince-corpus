<A NAME="off_1475273"></A><A NAME="1c677dca"></A><FONT FACE="Arial" SIZE="3"><H1>PClock
<P>
</H1>The processor generates an internal clock, <B>PClock</B>, it is normally four times the <B>MasterClock</B> frequency and precisely aligns every other rising edge of <B>PClock</B> with the rising edge of <B>MasterOut</B>.
<P>
All internal registers and latches use <B>PClock</B>, which is the pipeline clock rate.
<P>
