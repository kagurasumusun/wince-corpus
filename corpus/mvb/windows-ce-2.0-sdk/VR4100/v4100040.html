<A NAME="off_460109"></A><A NAME="03f8c7a6"></A><FONT FACE="Arial" SIZE="3"><H1>Multiple Matches
<P>
</H1>If more than one entry in the TLB matches the virtual address being
translated, the operation is undefined and the TLB may be disabled. The TLB-Shutdown<I> (TS)</I> bit in the <I>Status </I>register is set to 1 if the TLB is disabled.
<P>
</FONT></BODY>
