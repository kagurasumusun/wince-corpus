<A NAME="off_1474869"></A><A NAME="8fadfa5c"></A><FONT FACE="Arial" SIZE="3"><H1>MasterClock
<P>
</H1>The processor bases all internal and external clocking on the single <B>MasterClock</B> input signal. The processor generates the clock output signal,<B> MasterOut</B>, at the same frequency as <B>MasterClock</B>.
