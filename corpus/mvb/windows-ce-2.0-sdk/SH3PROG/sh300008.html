<A NAME="off_164055"></A><A NAME="9e8b045c"></A><FONT FACE="Arial" SIZE="5"><B>3.1   Data Format in Registers</B></FONT><FONT FACE="Arial" SIZE="3"><B> 
<P>
</B>Register operands are always longwords (32 bits) (figure 3.1). When the memory
operand is only a byte (8 bits) or a word (16 bits), it is sign-extended into
a longword when loaded into a register.
