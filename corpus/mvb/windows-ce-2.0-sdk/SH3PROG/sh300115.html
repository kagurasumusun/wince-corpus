<A NAME="off_3571712"></A><A NAME="fd70c8b8"></A><FONT FACE="Arial" SIZE="4"><B>7.1.4   Power-Down State 
<P>
</B></FONT><FONT FACE="Arial" SIZE="3">In the power-down state, the CPU operation halts and power consumption
declines. The SLEEP instruction places the CPU in the power-down state. This state has
two modes: sleep mode and standby mode. See</FONT><FONT FACE="Arial" COLOR="#008000" SIZE="3"><A HREF="sh300117.htm"> section 7.2 </A></FONT><FONT FACE="Arial" SIZE="3"> for more details. 
<P>
</FONT></BODY>
