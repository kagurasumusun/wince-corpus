<A NAME="off_3539950"></A><A NAME="e9fb6e1e"></A><FONT FACE="Arial" SIZE="4"><B>7.1.1   Reset State 
<P>
</B></FONT><FONT FACE="Arial" SIZE="3">In the reset state, the CPU is reset. This occurs when the </FONT><FONT FACE="TimesOverbar" SIZE="3">RESET</FONT><FONT FACE="Arial" SIZE="3"> pin level goes low. When the </FONT><FONT FACE="TimesOverbar" SIZE="3">BREQ</FONT><FONT FACE="Arial" SIZE="3"> pin is high, the result is a power-on reset; when it is low, a manual reset
will occur.
<P>
</FONT></BODY>
