<A NAME="off_197618"></A><A NAME="e32fe8f0"></A><FONT FACE="Arial" SIZE="4"><B>4.1.4   Load-Store Architecture 
<P>
</B></FONT><FONT FACE="Arial" SIZE="3">Basic operations are executed between registers. For operations that involve
memory access, data is loaded to the registers and executed (load-store
architecture). Instructions such as AND that manipulate bits, however, are executed
directly in memory.
<P>
</FONT></BODY>
