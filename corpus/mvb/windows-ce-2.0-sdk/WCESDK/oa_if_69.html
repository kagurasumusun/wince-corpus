<h1><a name="_wcesdk_com_istorage_revert"></a>IStorage::Revert</h1>
<p>
The <b>IStorage::Revert</b> method discards all changes that have been made to the storage object since the last commit.</p>
<h2>Syntax</h2>
<b>HRESULT Revert( void);</b>
