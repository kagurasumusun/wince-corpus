<h1><a name="_wcesdk_win32_tb_getrows"></a>TB_GETROWS </h1>
<p>
The TB_GETROWS message retrieves the number of rows of buttons in a toolbar with the TBSTYLE_WRAPABLE style. </p>
<h2>Syntax</h2>
<p>
<b>TB_GETROWS <BR></b><i>wParam</i> = 0; <BR><i>lParam</i> = 0; </p>
