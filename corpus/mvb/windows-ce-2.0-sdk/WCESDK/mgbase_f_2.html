<h2><a name="_wcesdk_win32_deletedc"></a>DeleteDC</h2>
<p>
The <b>DeleteDC</b> function deletes the specified device context (DC). </p>
<h3>Syntax</h3>
<p>
<b>BOOL</b> <b>DeleteDC(HDC</b> <i>hdc<b>)</i>;</b> </p>
