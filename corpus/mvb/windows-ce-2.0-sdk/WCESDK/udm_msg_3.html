<h1><a name="_wcesdk_win32_udm_getpos"></a>UDM_GETPOS </h1>
<p>
The UDM_GETPOS message retrieves the current position of an up-down control. </p>
<h2>Syntax</h2>
<p>
<b>UDM_GETPOS<BR></b><i>wParam</i> = 0;<BR><i>lParam</i> = 0;</p>
