<h1><a name="_wcesdk_pbm_getpos"></a>PBM_GETPOS</h1>
<p>
The PBM_GETPOS message retrieves the current position of the progress bar. </p>
<h2>Syntax</h2>
<p>
<b>PBM_GETPOS</b><BR><i>wParam</i> = 0;<BR><i>lParam</i> = 0;</p>
