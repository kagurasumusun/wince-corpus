<h1><a name="_wcesdk_win32_sb_setminheight"></a>SB_SETMINHEIGHT </h1>
<p>
The SB_SETMINHEIGHT message sets the minimum height of a status window's drawing area. </p>
<h2>Syntax</h2>
<p>
<b>SB_SETMINHEIGHT<BR></b><i>wParam</i> <b>= (WPARAM)</b> <i>minHeight</i>;<BR><i>lParam</i> = 0;</p>
