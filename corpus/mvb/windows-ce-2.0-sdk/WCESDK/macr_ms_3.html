<h1><a name="_wcesdk_win32_makelong"></a>MAKELONG </h1>
<p>
The <b>MAKELONG</b> macro creates an unsigned 32-bit value by concatenating two given 16-bit values. </p>
<h2>Syntax</h2>
<p>
<b>DWORD</b> <b>MAKELONG(<BR></b>&#09;<b>WORD</b> <i>wLow</i><b>,<BR></b>&#09;<b>WORD</b> <i>wHigh<BR></i><b>);</b></p>
