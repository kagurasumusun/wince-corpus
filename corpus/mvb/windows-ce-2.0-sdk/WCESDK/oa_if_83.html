<h1><a name="_wcesdk_com_istream_stat"></a>IStream::Stat</h1>
<p>
The <b>IStream::Stat</b> method retrieves the <b>STATSTG</b> structure for this stream.</p>
<h2>Syntax</h2>
<p>
<b>HRESULT Stat(<BR>STATSTG * </b><i>pstatstg</i><b>,</b><i><BR></i><b>DWORD</b> <i>grfStartFlag<BR></i><b>);</b></p>
