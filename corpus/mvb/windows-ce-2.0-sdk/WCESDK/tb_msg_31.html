<h1><a name="_wcesdk_win32_tb_setparent"></a>TB_SETPARENT </h1>
<p>
The TB_SETPARENT message sets the parent window for a toolbar. </p>
<h2>Syntax</h2>
<p>
<b>TB_SETPARENT <BR></b><i>wParam</i> = <b>(WPARAM)(HWND)</b> <i>hwndParent</i>; <BR><i>lParam</i> = 0; </p>
