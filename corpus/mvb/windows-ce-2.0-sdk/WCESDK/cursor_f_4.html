<h1><a name="_wcesdk_win32_getcursor"></a>GetCursor</h1>
<p>
The <b>GetCursor</b> function retrieves the handle to the current cursor. </p>
<h2>Syntax</h2>
<b>HCURSOR GetCursor(VOID)</b>
