<h1><a name="_wcesdk_win32_tbm_getpos"></a>TBM_GETPOS </h1>
<p>
The TBM_GETPOS message retrieves the current position of the slider in a trackbar. </p>
<h2>Syntax</h2>
<p>
<b>TBM_GETPOS<BR></b><i>wParam</i> = 0;<BR><i>lParam</i> = 0;</p>
