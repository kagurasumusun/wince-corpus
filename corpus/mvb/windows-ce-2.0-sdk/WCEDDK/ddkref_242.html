<H2><A NAME="_wceddk_DrvEndDoc"></A>DrvEndDoc</H2>
<P>
<B>DrvEndDoc</B>&nbsp;causes the driver to send any control information needed at
the end of a document.
<H5>Syntax</H5>
<P>
<B>BOOL DrvEndDoc(IN SURFOBJ <I>*</B>pso</I><B>, IN FLONG </B><I>fl</I><B>);</B>
