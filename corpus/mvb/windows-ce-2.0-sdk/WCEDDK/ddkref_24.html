<UL>
<LI>
<A HREF="ddkref_25.htm">ACMDRV_MESSAGE_PARAMS</A>
<P>
<LI>
<A HREF="ddkref_26.htm">ACMDRVFORMATSUGGEST</A>
<P>
<LI>
<A HREF="ddkref_27.htm">ACMDRVOPENDESC</A>
<P>
<LI>
<A HREF="ddkref_28.htm">ACMDRVSTREAMHEADER</A>
<P>
<LI>
<A HREF="ddkref_29.htm">ACMDRVSTREAMINSTANCE</A>
<P>
<LI>
<A HREF="ddkref_30.htm">ACMDRVSTREAMSIZE</A>

CODECMSG.D.
