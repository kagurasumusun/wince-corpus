<P>
<B>PVOID</B>&nbsp;<B>ACM_Init(DWORD</B>&nbsp;<I>dwInfo</I><B>) </B>
<P>
Device initialization routine
<H5>Return Value</H5>
<P>
Returns a DWORD which will be passed to Open &amp; Deinit or NULL if unable to
initialize the device.
<H5>Parameters</H5>

<DT>
<I>dwInfo</I>
<DD>
