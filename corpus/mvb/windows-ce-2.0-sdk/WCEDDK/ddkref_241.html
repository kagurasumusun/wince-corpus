<H2><A NAME="_wceddk_DrvEnableSurface"></A>DrvEnableSurface</H2>
<P>
<B>DrvEnableSurface</B>&nbsp;sets up a surface to be drawn on and associates it
with a given <B>PDEV</B>.
<H5>Syntax</H5>
<P>
<B>HSURF DrvEnableSurface(IN DHPDEV </B><I>dhpdev</I><B>);</B>
