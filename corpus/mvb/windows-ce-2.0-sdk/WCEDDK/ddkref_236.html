<H2><A NAME="_wceddk_Printer_Driver_Functions"></A>Printer Driver Functions</H2>
<P>
This section documents the graphics driver functions that must be implemented
by Windows CE printer drivers. In nearly all cases, these functions are
identical to their Win32 counterparts. For complete documentation on these
functions, see the Windows NT Device Driver Kit
