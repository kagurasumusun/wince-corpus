<H2><A NAME="_wceddk_CARD_EVENT"></A>CARD_EVENT</H2>
<P>
The 32-bit <B>CARD_EVENT</B>&nbsp;is used for an event code in a registered client
callback function. Card Services calls the callback function when an
associated PC Card event occurs.
<H5>Syntax</H5>
<P>
<B>typedef UINT32 CARD_EVENT;</B>
<H5>See Also</H5>
<P>
<B><A HREF="ddkref_92.htm">PC Card Event Codes</A></B>, <B><A HREF="ddkref_61.htm">CardRegisterClient</A></B>,
<B><A HREF="ddkref_88.htm">CLIENT_CALLBACK</A></B>
