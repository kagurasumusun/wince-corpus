<H2><A NAME="_wceddk_Cursor_Display"></A>Cursor Display</H2>
<P>
Implementation of cursor display is optional based upon the intended platform.
If the platform uses a stylus, or a shell without a pointer, the following
functions can simply return S_OK. On some platforms it may be acceptable to
display only monochrome cursors.
