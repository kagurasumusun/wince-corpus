<A NAME="off_623981"></A><A NAME="00006333"></A><FONT FACE="Arial" SIZE="4"><B>/Oi (Generate Intrinsic Functions)
<P>
</B></FONT><FONT FACE="Arial" SIZE="3">The /Oi option instructs the compiler to replace <B>_alloca</B> calls with inline code sequences. In addition it instructs the compiler to
substitute memcpy and memcmp for strcpy and strcmp when the latter have constant
source arguments.
