<A NAME="off_1409024"></A><A NAME="e186ee70"></A><FONT FACE="Arial" SIZE="4"><B>Using DUMPBIN to View Decorated Names
<P>
</B></FONT><FONT FACE="Arial" SIZE="3">To get the decorated form of a function using DUMPBIN, run DUMPBIN on the .OBJ
or .LIB file using the /SYMBOLS option. Find the undecorated function
definition in the output. The undecorated name is followed by the decorated name, each
enclosed in parentheses.
