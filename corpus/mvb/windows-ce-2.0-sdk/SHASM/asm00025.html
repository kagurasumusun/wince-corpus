<A NAME="off_786849"></A><A NAME="0a4059c1"></A><FONT FACE="Arial" SIZE="4"><B>2.2.3  Operand Coding 
<P>
</B></FONT><FONT FACE="Arial" SIZE="3">The operand is written following the operation field, separated by one or more
spaces or tabs.
<P>
<B>Example:
<P>
 </B></FONT><FONT FACE="Lucida Sans Typewriter" SIZE="3">ADD  R0,R1  ; The ADD instruction takes two arguments.
<P>
 SHAL R1   ; The SHAL instruction takes one argument.
<P>
</FONT></BODY>
