<A NAME="off_1181845"></A><A NAME="fc627f77"></A><FONT FACE="Arial" SIZE="4"><B>4.1.1  Mnemonic 
<P>
</B></FONT><FONT FACE="Arial" SIZE="3">The mnemonic expresses the type of executable instruction. Abbreviations that
indicate the type of processing are provided as mnemonics for SH microprocessor
instructions. The assembler does not distinguish upper-case and lower-case
letters in mnemonics.
<P>
</FONT></BODY>
