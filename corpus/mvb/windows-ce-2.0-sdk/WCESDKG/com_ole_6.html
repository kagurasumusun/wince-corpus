<h2><a name="_wcesdk_process_and_threads"></a>Process and Threads</h2>
<p>
In Windows CE a thread must be initialized as free-threaded to be consistent with the multithreaded concurrency control. Thus, the <i>dwCoInit</i> parameter in <b>CoInitializeEx</b> must be set to the value of COINIT_MULTITHREADED. Other specifications are not valid. </p>
