<h3><a name="_wcesdk_creating_the_window"></a>Creating the Window </h3>
<p>
The <b>CreateWindow </b>function specifies the details of your window's appearance and functionality. The parameters for <b>CreateWindow</b> are the same for Windows 95 and Windows CE; however, it is best to use defaults for the initial size and position parameters. </p>
