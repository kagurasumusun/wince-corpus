<h3><a name="_wcesdk_handling_mail_errors"></a>Handling Mail Errors</h3>
<p>
If an error occurs, the error condition can be retrieved with <A HREF='javascript:document.x.iv.ALink("_wcesdk_mailerror","")'><b>MailError</b></a>. You can call <A HREF='javascript:document.x.iv.ALink("_wcesdk_mailerrormsg","")'><b>MailErrorMsg</b></a> to obtain a more verbose description of the error condition.</p>
