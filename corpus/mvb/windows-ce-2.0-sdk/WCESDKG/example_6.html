<h3><a name="_wcesdk_painting_the_window_and_the_message_loop"></a>Painting the Window and the Message Loop </h3>
<p>
The functions for painting the window, <b>CreateWindow</b>,<b> ShowWindow</b>,<b> </b>and<b> UpdateWindow</b>, along with the message loop functions, <b>GetMessage</b>,<b> TranslateMessage</b>, and<b> DispatchMessage</b>, exhibit functionality common to all Windows-based programs.</p>
