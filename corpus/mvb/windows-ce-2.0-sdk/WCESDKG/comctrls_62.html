<h3><a name="_wcesdk_tab_control_notifications"></a>Tab Control Notifications</h3>
<dl>
<dt>
The following tab control notifications are the same in Windows CE as they are in Windows 95 and Windows NT.</dt>
<dd>
<A HREF='javascript:document.x.iv.ALink("_wcesdk_win32_tcn_keydown","")'>TCN_KEYDOWN</a><p>
<A HREF='javascript:document.x.iv.ALink("_wcesdk_win32_tcn_selchange","")'>TCN_SELCHANGE</a></p>
<p>
<A HREF='javascript:document.x.iv.ALink("_wcesdk_win32_tcn_selchange","")'>TCN_SELCHANGING</a></p>
</dd>
</dl>
<p>
Windows CE doesn't support the TCN_GETOBJECT notification message.</p>
