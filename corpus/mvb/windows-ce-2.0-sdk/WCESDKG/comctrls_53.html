<h3><a name="_wcesdk_rebar_notifications"></a>Rebar Notifications</h3>
<p>
Windows CE supports the following rebar notifications.</p>
<p>
<A HREF='javascript:document.x.iv.ALink("_wcesdk_nm_customdraw","")'>NM_CUSTOMDRAW</a></p>
<p>
<A HREF='javascript:document.x.iv.ALink("_wcesdk_nm_nchittest","")'>NM_NCHITTEST</a></p>
<p>
<A HREF='javascript:document.x.iv.ALink("_wcesdk_rbn_autosize","")'>RBN_AUTOSIZE</a></p>
<p>
<A HREF='javascript:document.x.iv.ALink("_wcesdk_rbn_begindrag","")'>RBN_BEGINDRAG</a></p>
<p>
<A HREF='javascript:document.x.iv.ALink("_wcesdk_rbn_enddrag","")'>RBN_ENDDRAG</a></p>
<p>
<A HREF='javascript:document.x.iv.ALink("_wcesdk_rbn_heightchange","")'>RBN_HEIGHTCHANGE</a></p>
<p>
<A HREF='javascript:document.x.iv.ALink("_wcesdk_rbn_layoutchanged","")'>RBN_LAYOUTCHANGED</a></p>
<p>
Windows CE doesn't support the RBN_GETOBJECT notification.</p>
