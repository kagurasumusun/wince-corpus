<h3><a name="_wcesdk_sending_messages"></a>Sending Messages</h3>
<p>
Sending a message involves a simple variant of message insertion:
<ul>
<li>
Set the MAIL_STATUS_COMPOSED flag<br><br></li>
<li>
Set the MAIL_FOLDER_OUTBOX flag to direct the message to the outbox folder.</li>
</ul>
<p>
Next time a user connects to the service specified on the message, the message will be sent.</p>
