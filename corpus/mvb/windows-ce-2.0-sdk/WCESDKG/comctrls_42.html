<h3><a name="_wcesdk_progress_bar_styles"></a>Progress Bar Styles</h3>
<p>
Windows CE supports the following two new progress bar styles.</p>
<table>
<tr valign=top>
<td>
<b>Style </b></td>
<td>
<b>Description</b></td>
</tr>
<tr valign=top>
<td>
PBS_SMOOTH </td>
<td>
Displays progress status in a smooth scrolling bar instead of the default segmented bar. </td>
</tr>
<tr valign=top>
<td>
PBS_VERTICAL </td>
<td>
Displays progress status vertically, from bottom to top. </td>
</tr>
</table><br>
