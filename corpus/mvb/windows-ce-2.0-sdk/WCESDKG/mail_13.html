<h3><a name="_wcesdk_updating_message_store"></a>Updating Message Store </h3>
<p>
If your applications changes any of the members of <A HREF='javascript:document.x.iv.ALink("_wcesdk_mailmsg","")'><b>MailMsg</b></a> (sets the MAIL_STATUS_READ flag, for instance) the message store is not affected until the message is reinserted. You must call the <A HREF='javascript:document.x.iv.ALink("_wcesdk_mailupdate","")'><b>MailUpdate</b></a> function to replace the modified message in the message store.</p>
