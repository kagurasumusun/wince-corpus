<h3><a name="_wcesdk_static_control_notifications"></a>Static Control Notifications</h3>
<p>
The following static control notifications are the same in Windows CE as they are in Windows 95 and Windows NT.</p>
<p>
<A HREF='javascript:document.x.iv.ALink("_wcesdk_win32_stn_clicked","")'>STN_CLICKED</a></p>
<p>
<A HREF='javascript:document.x.iv.ALink("_wcesdk_win32_stn_disable","")'>STN_DISABLE</a></p>
<p>
<A HREF='javascript:document.x.iv.ALink("_wcesdk_win32_stn_enable","")'>STN_ENABLE</a></p>
<p>
Windows CE doesn't support the STN_DBLCLK notification.</p>
<p>
