<h2><a name="_wcesdk_file_filter_interfaces_and_structures"></a>File Filter Interfaces and Structures</h2>
<p>
Windows CE Services communicates with a file filter by calling methods in interfaces supported by the filter. This section describes the interfaces and structures that a file filter may implement or use. </p>
