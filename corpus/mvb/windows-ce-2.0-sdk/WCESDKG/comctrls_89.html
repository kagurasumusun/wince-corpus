<h3><a name="_wcesdk_up_down_control_structures"></a>Up-down Control Structures</h3>
<p>
The <A HREF='javascript:document.x.iv.ALink("_wcesdk_win32_udaccel_str","")'><b>UDACCEL</b></a> structure is the same in Windows CE as in Windows 95 and Windows NT.</p>
<p>
In Windows CE, the <A HREF='javascript:document.x.iv.ALink("_wcesdk_win32_nm_updown_str","")'><b>NM_UPDOWN</b></a> structure has been renamed <A HREF='javascript:document.x.iv.ALink("_wcesdk_win32_nm_updown_str","")'><b>NMUPDOWN</b></a>, to conform to standard naming conventions, but the two structures are identical.  </p>
