<h2><a name="_wcesdk_type_building_interfaces"></a>Type Building Interfaces</h2>
<p>
Windows CE offers full support of the four type-building interfaces <b>ICreateTypeInfo</b>, <b>ICreateTypeInfo2</b>, <b>ICreateTypeLib</b> and <b>ICreateTypeLib2</b>, with one exception. The <b>ICreateTypeLib::SaveAllChanges</b> member function is not currently implemented in Windows CE.</p>
