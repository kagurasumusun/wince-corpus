<H1 class="dtH1"><A NAME="cereftransportprotocols"></A>Transport Protocols</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<P>DCOM for Windows CE supports TCP/IP and local process communications. If you do not have TCP/IP installed, DCOM will not be able to support cross-computer COM. </P>
