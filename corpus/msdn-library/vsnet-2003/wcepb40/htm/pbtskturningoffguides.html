<H1 class="dtH1"><A NAME="pbtskturningoffguides"></A>Turning Off the Guides</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<OL type="1">
	<LI>Choose <B>Guide Settings</B> from the <B>Layout</B> menu.</li>

	<LI>Select <B>None</B> under <B>Layout Guides</B>.</li>

	<LI>Choose <B>OK</B>.</li>
</OL>
