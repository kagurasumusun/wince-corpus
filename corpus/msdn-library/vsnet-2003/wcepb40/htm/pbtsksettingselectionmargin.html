<H1 class="dtH1"><A NAME="pbtsksettingselectionmargin"></A>Setting the Selection Margin</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<OL type="1">
	<LI>Choose <B>Options</B> from the <B>Tools</B> menu.</li>

	<LI>Choose the <B>Editor</B> tab.</li>

	<LI>Select the <B>Selection Margin</B> check box.</li>

	<LI>Choose <B>OK</B>. </li>
</OL>
