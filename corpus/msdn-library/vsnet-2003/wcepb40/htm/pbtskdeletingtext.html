<H1 class="dtH1"><A NAME="pbtskdeletingtext"></A>Deleting Text</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<OL type="1">
	<LI>Select the text that you want to delete.</li>

	<LI>Choose <B>Delete</B> from the <B>Edit</B> menu. 
<P>The deleted text is not placed onto the Clipboard and cannot be pasted.
</li>
</OL>
