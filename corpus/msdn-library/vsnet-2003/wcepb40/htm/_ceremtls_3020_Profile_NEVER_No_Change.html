<H1 class="dtH1"><A NAME="_ceremtls_3020_profile_never_no_change"></A>Error 3020: Profile=NEVER, No Change</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<PRE class="syntax"><B>Global State Never, Unchanged</B></PRE>

<P>When the Icecap.ini file sets the Profile setting to OFF,OFF,NEVER, subsequent calls to change profiling level states are ignored.</P>
