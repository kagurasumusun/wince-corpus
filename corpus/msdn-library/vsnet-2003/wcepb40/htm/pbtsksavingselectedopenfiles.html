<H1 class="dtH1"><A NAME="pbtsksavingselectedopenfiles"></A>Saving Selected Open Files</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<OL type="1">
	<LI>Choose <B>Windows</B> from the <B>Window</B> menu.</li>

	<LI>Select one or more files from the file list.</li>

	<LI>Choose <B>Save</B>.</li>

	<LI>Choose <B>OK</B>.</li>
</OL>
