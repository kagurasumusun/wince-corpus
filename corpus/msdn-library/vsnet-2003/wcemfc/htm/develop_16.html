<H1><A NAME="_wcemfc_the_role_of_the_view_in_printing"></A><SUP></SUP>The Role of the View in Printing</H1>

<P>Your view also plays two important roles in printing its associated document. The view:

<UL type=disc>
	<LI>Uses the same <B>OnDraw</B> code to draw on the printer as to draw on the screen</LI>

	<LI>Manages dividing the document into pages for printing</LI>
</UL>
