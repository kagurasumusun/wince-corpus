<H1><A NAME="_wcemfc_ceditview_lockbuffer"></A><SUP></SUP>CEditView::LockBuffer</H1>

<P>This method obtains a pointer to the buffer. The buffer should not be modified.</P>

<PRE class=syntax><B>LPCTSTR LockBuffer( )
const;</B><I> </I></PRE>

<H4>Return Value</H4>

<P>A pointer to the buffer of the edit control.</P>

<P><A HREF="ceditvw_18.htm"><B>CEditView::UnlockBuffer</B></A>, <A HREF="ceditvw_4.htm"><B>CEditView::GetBufferLength</B></A> </P>
