<H1><A NAME="_wcemfc_cwnd_getstyle"></A>CWnd::GetStyle</H1>

<P>This method retrieves the window style. </P>

<PRE class=syntax><B>DWORD GetStyle( )
const;</B><I> </I></PRE>

<H4>Return Value</H4>

<P>Returns the window style.</P>

<H4>Requirements</H4>

<P><B>&nbsp;&nbsp;Windows CE versions:</B> 1.0 and later<BR>
&nbsp;&nbsp;<B>Header file:</B> Declared in Afxwin.h<BR>
&nbsp;&nbsp;<B>Platform:</B> H/PC Pro, Palm-size PC, Pocket PC</P>
