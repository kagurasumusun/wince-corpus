<H1 class="dtH1"><A NAME="cerefloadreg"></A>loadreg</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<P>This command reads the contents of a .reg file.</P>

<PRE class="syntax"><B>loadreg </B>[<I>reg input file</I>]</PRE>

<H4 class="dtH4">Parameters</H4>

<DL>
<DT><I>reg input file</I></DT>

<DD>Specifies the .reg file to be read.</dd>
</DL>
