<H1><A NAME="_wceatl_operators_ccomvariant"></A>Operators</H1>

<TABLE>

<TR VALIGN="top">
<TH width=29%>Operator</TH>
<TH width=71%>Description</TH>
</TR>

<TR VALIGN="top">
<TD width=29%><A HREF="ccomvar_11.htm"><B>operator =</B></A></TD>
<TD width=71%>Assigns a value to the <B>CComVariant</B> object.</TD>
</TR>

<TR VALIGN="top">
<TD width=29%><A HREF="ccomvar_12.htm"><B>operator ==</B></A></TD>
<TD width=71%>Indicates whether the <B>CComVariant</B> object equals the specified <B>VARIANT</B>.</TD>
</TR>

<TR VALIGN="top">
<TD width=29%><A HREF="ccomvar_13.htm"><B>operator !=</B></A></TD>
<TD width=71%>Indicates whether the <B>CComVariant</B> object does not equal the specified <B>VARIANT</B>.</TD>
</TR>
</TABLE><BR>
