<H1><A NAME="_wceatl_methods_ccomapartment"></A>Methods</H1>

<TABLE>

<TR VALIGN="top">
<TH width=27%>Method</TH>
<TH width=73%>Description</TH>
</TR>

<TR VALIGN="top">
<TD width=27%><A HREF="ccomapt_2.htm"><B>GetLockCount</B></A></TD>
<TD width=73%>Returns the current lock count on the thread.</TD>
</TR>

<TR VALIGN="top">
<TD width=27%><A HREF="ccomapt_3.htm"><B>Lock</B></A></TD>
<TD width=73%>Increments the lock count on the thread.</TD>
</TR>

<TR VALIGN="top">
<TD width=27%><A HREF="ccomapt_4.htm"><B>Unlock</B></A></TD>
<TD width=73%>Decrements the lock count on the thread.</TD>
</TR>
</TABLE><BR>

<P>Note that<B> CComApartment::Apartment</B> is not supported in ATL for Windows CE.</P>
