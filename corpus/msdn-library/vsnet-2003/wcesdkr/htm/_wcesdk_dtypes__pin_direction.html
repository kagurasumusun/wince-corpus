<H1 class="dtH1"><A NAME="_wcesdk_dtypes__pin_direction"></A>PIN_DIRECTION</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<P>Indicates a pin's direction. </P>

<PRE class="syntax"><B>typedef enum _PinDirection {</B>
<I>PINDIR_INPUT</I><B>,</B>
<I>PINDIR_OUTPUT</I>
<B>} PIN_DIRECTION;</B></PRE>

<P class="label"><B>Elements</B>

<DL>
<DT><I>PINDIR_INPUT</I></DT>

<DD>input pin. </dd>

<DT><I>PINDIR_OUTPUT</I></DT>

<DD>Output pin. </dd>
</DL>
