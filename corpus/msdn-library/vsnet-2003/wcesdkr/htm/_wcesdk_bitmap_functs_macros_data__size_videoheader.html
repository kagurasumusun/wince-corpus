<DIV id="nstext" valign="bottom">
<P>Calculates the size of the video image. </P>

<PRE class="syntax"><B>SIZE_VIDEOHEADER</B></PRE>

<P class="label"><B>Return Values</B></P>

<P>Returns the combined size of all of the <A HREF="_wcesdk_structs__videoinfoheader.htm"><B>VIDEOINFOHEADER</B></A> structure's data members. </P>
