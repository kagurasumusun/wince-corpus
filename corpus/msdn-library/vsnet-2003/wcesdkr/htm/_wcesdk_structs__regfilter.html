<H1 class="dtH1"><A NAME="_wcesdk_structs__regfilter"></A>REGFILTER</H1>

<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<P>Identifies a filter in the registry. </P>

<PRE class="syntax"><B>typedef struct {</B>
<B>CLSID </B><I>Clsid</I><B>;</B>
<B>LPWSTR </B><I>Name</I><B>;</B>
<B>} REGFILTER;</B></PRE>

<P class="label"><B>Members</B>

<DL>
<DT><I>Clsid</I></DT>

<DD>Class identifier of the filter. </dd>

<DT><I>Name</I></DT>

<DD>Name of the filter. </dd>
</DL>
