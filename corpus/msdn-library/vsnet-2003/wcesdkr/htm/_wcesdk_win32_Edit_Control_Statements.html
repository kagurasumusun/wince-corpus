<H1 class="dtH1"><A NAME="_wcesdk_win32_edit_control_statements"></A>Edit Control Statements</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<PRE class="syntax"><B>editClass</B> <I>id</I></PRE>

<DL>
<DT><I>editClass </I></DT>

<DD>Specifies one of the following classes: <B>EDITTEXT</B>, <B>BEDIT</B>, <B>HEDIT</B>, or <B>IEDIT</B>. </dd>

<DT><I>id</I></DT>

<DD>Specifies the control identifier. </dd>
</DL>
