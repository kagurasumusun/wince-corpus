<H1 class="dtH1"><A NAME="cmrefipv6gp"></A>Ipv6 gp</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<P>The ipv6 gp command displays the values of the global parameters for the IPv6 protocol.</P>

<PRE class="syntax"><B>ipv6</B> [<I>-p</I>] <B>gp</B> </PRE>

<H4 class="dtH4">Parameters</H4>

<DL>
<DT><I>-p </I></DT>

<DD>Saves the setting in the registry. </dd>
</DL>
