<H1 class="dtH1"><A NAME="cerefpause"></A>PAUSE</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<P>This command suspends the processing of a batch program and displays the following message: <code class="ce">Press any key to continue…</code></P>

<PRE class="syntax"><B>PAUSE</B></PRE>

<H4 class="dtH4">Parameters</H4>

<P>None.</P>
