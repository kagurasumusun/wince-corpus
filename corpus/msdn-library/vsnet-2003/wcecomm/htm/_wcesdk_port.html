<H1 class="dtH1"><A NAME="_wcesdk_port"></A>Port</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<P>Specifies the port reserved on the gateway device.</P>

<P class="label"><B>Path</B></P>

<P><B>HKEY_LOCAL_MACHINE\Comm\ConnectionSharing\Servers\<I>Service</I></B></P>

<P class="label"><B>Value Type</B></P>

<P>REG_DWORD</P>

<P class="label"><B>Valid Range</B></P>

<P>0 to 0xFFFF</P>

<P class="label"><B>Default Value</B></P>

<P>None</P>
