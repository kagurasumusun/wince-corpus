<H1 class="dtH1"><A NAME="pburfmenueditorwindow"></A>Menu Editor Window</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<P>Use the Menu Editor window to edit your program's menu resources. You can right-click this window to display a shortcut menu of commands.</P>
