<H1 class="dtH1"><A NAME="_wcesdk_transport_protocols"></A>Transport Protocols</H1>

<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<P>DCOM for Windows CE 3.0 supports TCP/IP and local process communications. If you do not have TCP/IP installed, DCOM will not be able to support cross-computer COM.</P>
