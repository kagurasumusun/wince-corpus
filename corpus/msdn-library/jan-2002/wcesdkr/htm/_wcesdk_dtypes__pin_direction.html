<H1><SUP></SUP>PIN_DIRECTION</H1>

<P>Indicates a pin's direction. </P>

<PRE class="syntax"><B>typedef enum _PinDirection {
</B><I>PINDIR_INPUT</I><B>,
</B><I>PINDIR_OUTPUT
</I><B>} PIN_DIRECTION;</B></PRE>

<H4>Elements</H4>

<DL>
<DT><I>PINDIR_INPUT</I></DT>

<DD>input pin. </dd>

<DT><I>PINDIR_OUTPUT</I></DT>

<DD>Output pin. </dd>
</DL>
