<H1><SUP></SUP>CAMEvent::operator HANDLE</H1>

<P>Gets the <B>HANDLE</B> object associated with this <A HREF="_wcesdk_camevent_class.htm"><B>CAMEvent</B></A> object. </P>

<PRE class="syntax"><B>operator HANDLE () const;</B></PRE>

<H4>Return Values</H4>

<P>Returns the Microsoft Win32 event <B>HANDLE</B>. </P>
