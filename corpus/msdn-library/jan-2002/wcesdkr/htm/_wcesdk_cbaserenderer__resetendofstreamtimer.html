<H1><SUP></SUP>CBaseRenderer::ResetEndOfStreamTimer</H1>

<P>If the end-of-stream timer is nonzero, this function sets it to zero. </P>

<PRE class="syntax"><B>void ResetEndOfStreamTimer(void);</B></PRE>

<H4>Return Values</H4>

<P>No return value. </P>
