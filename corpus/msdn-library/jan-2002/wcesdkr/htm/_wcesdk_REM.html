<H1><SUP></SUP>REM</H1>

<P>This command records comments in a batch file.</P>

<PRE class="syntax"><B>REM</B> [<I>comments</I>]</PRE>

<H4>Parameters</H4>

<DL>
<DT><I>comments</I></DT>

<DD>Specifies the comments that you want to record in the batch file.</dd>
</DL>
