<H1><SUP></SUP>Previous</H1>

<P>Jumps to the previous clip in the playlist.</P>

<P><B>Compatibility:</B> Windows Media Player</P>

<PRE class="syntax"><B>MediaPlayer.Previous(&nbsp;)</B></PRE>

<H4>Return Values</H4>

<P>No return value. </P>
