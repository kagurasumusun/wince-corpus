<H1><SUP></SUP>RESET_MASKS</H1>

<P>Clears the specified video image's bitmasks. </P>

<PRE class="syntax"><B>RESET_MASKS(
</B><I>pbmi</I><B>)</B></PRE>

<H4>Parameters</H4>

<DL>
<DT><I>pbmi</I></DT>

<DD>Structure that specifies the video image. </dd>
</DL>

<H4>Return Values</H4>

<P>No return value. </P>
